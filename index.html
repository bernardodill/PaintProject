<!DOCTYPE html>
<html>
	<head lang="pt-br">
		
		<meta charset="utf-8"/>
		<link rel="stylesheet" type="text/css" href="estiloDesenho.css"/>
		<link rel="stylesheet" type="text/css" href="assets/fontawesome-free-6.2.1-web/css/all.min.css">
		<script type="text/javascript" src="assets/fontawesome-free-6.2.1-web/js/all.min.js"></script>
		
	</head>
	<body>
		<div class="workspace">
			<canvas id='canvas1' width='800' height='1200' style='border:1px solid #555555; display:block; background-color: rgb(255, 255, 255); position:absolute; top:2%; left:20%; z-index:1; margin:auto;'></canvas>
		</div>

		<div class="menu" id="toolsMenu">
			<div id="dragMenu">

			</div>
			<div class="shapesTools">
				<a class="ferramenta  ativo" id="select" onclick="selecaoFerramentas(this)" title="Retangulo" href="#">
					<i class="fa-solid fa-arrow-pointer fa-xl"></i>
				</a>
				<a class="ferramenta" id="lapis" onclick="selecaoFerramentas(this)" title="Lápis" href="#">
					<i class="fa-solid fa-pencil fa-xl"></i>
				</a>
				<a class="ferramenta" id="linha" onclick="selecaoFerramentas(this)" title="Vértice" href="#" >
					<i class="fa-solid fa-slash fa-xl"></i>
				</a>

				<a class="ferramenta" id="retangulo" onclick="selecaoFerramentas(this)" title="Retangulo" href="#">
					<i class="fa-regular fa-square fa-xl"></i>
				</a>
				<a class="ferramenta" id="arco" onclick="selecaoFerramentas(this)" title="Circulo" href="#">
					<i class="fa-regular fa-circle fa-xl"></i>
				</a>

				<a class="ferramenta" id="borracha" onclick="selecaoFerramentas(this)" title="Borracha" href="#">
					<i class="fa-solid fa-eraser fa-xl"></i>
				</a>
				<a class="ferramenta undo" id="desfazer" onclick="undo()" title="Desfazer" href="#">
					<i class="fa-solid fa-rotate-left fa-xl"></i>
				</a>

				<a class="save" title="Salvar" href="#">
					<i class="fa-solid fa-download fa-xl"></i>
				</a>
			</div>

			<div class="toolSize">
				<button class="numberDown">
					<i class="fa-solid fa-angle-left fa-xl"></i>
				</button>

				<input type="text" class="size" min="1" value="1" title="Largura" width="20px" name="lineWidth"/>

				<button class="numberUp">
					<i class="fa-solid fa-angle-right fa-xl"></i>
				</button>
			</div>
			
			<div class="colorPicker">
				<input type="color" value="#000000" class="frontColor" name="colorFront"/>
				<input type="color" value="#ffffff" class="backColor" name="colorBack"/>
			</div>
			
		</div>
		<div class="menuLayers">
			<div class="layerOptions">
				<a class="ferramenta"  id="newLayer" title="Novo Layer">
					<i class="fa-regular fa-file fa-xl"></i>
				</a>
			</div>


			<ol class="layerList">
				<li class="li selected">Camada 1</li>
			</ol>

		</div>
		<div class="coordenadas">
			<p>Coords</p>
		</div>
		
		<!--Muda ferramenta-->
		<script type="text/javascript">
			function selecaoFerramentas(el){
				var elementoAnterior = $(".menu a").removeClass("ativo");
				$(el).addClass("ativo");
			}
		</script>
		
		<script src="js/dragToolsMenu.js"></script>
		<script type="module" src="js/mouseEvents.js"></script>
		<script type="module" src="js/buttonEvents.js"></script>
		<script type="module" src="js/app.js"></script>
	</body>
</html>
